<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">hwatu, the verification browser for AI coding agents</title>
  <desc id="desc">A warm, interruptible browser daemon with 35 millisecond verify passes.</desc>
  <rect width="1200" height="630" fill="#111111"/>
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="#f7f5ef"/>

  <g transform="translate(92 98)">
    <rect width="170" height="278" rx="12" fill="#ffffff" stroke="#111111" stroke-width="5"/>
    <circle cx="85" cy="172" r="52" fill="#111111"/>
    <path d="M32 172c25-16 43-47 53-95 12 48 31 79 55 95-24 12-43 35-55 69-10-34-28-57-53-69Z" fill="#f7f5ef"/>
    <path d="M70 160c11-14 22-22 34-24 10 16 13 33 8 51-18 8-35 5-51-8 0-7 3-13 9-19Z" fill="#111111"/>
    <circle cx="98" cy="155" r="4" fill="#f7f5ef"/>
    <path d="M28 65c25 0 45-12 60-36M142 65c-25 0-45-12-60-36" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
    <text x="85" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="19" font-weight="700" fill="#111111">HWATU</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111111">
    <text x="318" y="163" font-size="82" font-weight="800" letter-spacing="-4">hwatu</text>
    <text x="322" y="220" font-size="28" font-weight="700">the verification browser for AI coding agents</text>
    <line x1="322" y1="262" x2="1085" y2="262" stroke="#b4b0a5" stroke-width="2"/>
    <text x="322" y="330" font-size="46" font-weight="800">35 ms</text>
    <text x="520" y="330" font-size="25">verify pass</text>
    <text x="322" y="396" font-size="46" font-weight="800">1 call</text>
    <text x="520" y="396" font-size="25">load → inspect → screenshot</text>
    <text x="322" y="462" font-size="46" font-weight="800">live</text>
    <text x="520" y="462" font-size="25">agent ↔ human hand-off</text>
    <rect x="322" y="505" width="520" height="43" rx="8" fill="#111111"/>
    <text x="342" y="534" font-size="20" fill="#f7f5ef">github.com/hongnoul/hwatu</text>
  </g>
</svg>
