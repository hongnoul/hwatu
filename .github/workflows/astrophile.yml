# Copy to .github/workflows/astrophile.yml in your repo.
# Weekly growth snapshot + geo check, committed back to the repo so
# .astrophile/snapshots.jsonl becomes a long-term trend log.
name: astrophile weekly snapshot

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install astrophile
        run: cargo install --git https://github.com/hongnoul/astrophile --locked
      - name: Install Agent Reach screening tools
        env:
          AGENT_REACH_REV: b4d52c46c9113cb0f653d6df4cf71ebadf4930ac
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python3 -m pip install --user \
            "https://github.com/Panniantong/Agent-Reach/archive/${AGENT_REACH_REV}.zip"
          npm install -g mcporter@0.9.0
          exa_url='https://mcp.exa.ai/mcp'
          if [ -n "$EXA_API_KEY" ]; then
            exa_url="${exa_url}?exaApiKey=${EXA_API_KEY}"
          fi
          mcporter config add exa "$exa_url" --scope home
          "$HOME/.local/bin/agent-reach" doctor --json \
            > .astrophile/agent-reach-health.json
      - name: Snapshot + geo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          astrophile snapshot
          astrophile geo || true
          astrophile audit
      - name: Screen public signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/screen-public-signals.sh
      - name: Upload screening report
        uses: actions/upload-artifact@v4
        with:
          name: public-signal-screen
          path: |
            .astrophile/agent-reach-health.json
            .astrophile/public-signal-screen.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Commit trend log
        run: |
          git config user.name 'astrophile-bot'
          git config user.email 'actions@github.com'
          git add -f .astrophile/snapshots.jsonl
          git diff --cached --quiet || git commit -m 'astrophile: weekly snapshot'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
