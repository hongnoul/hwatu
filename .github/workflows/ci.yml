name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  ipc-conformance:
    name: IPC conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipc-${{ matrix.os }}

      - name: Test IPC protocol
        run: cargo test -p hwatu-ipc --locked

  check:
    name: Build, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev

      # Keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked

  display-free:
    name: Display-free behavioral (G4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev cage

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict userns via AppArmor, which breaks
        # WebKit's bubblewrap sandbox (bwrap: loopback: Failed RTM_NEWADDR).
        run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: display-free

      - name: Build release binaries
        run: cargo build --release --locked

      # GitHub runners have no display server at all, which is exactly
      # the environment G4 exists for: the daemon must spawn its own
      # headless compositor. The script unsets WAYLAND_DISPLAY/DISPLAY
      # itself and runs on isolated sockets.
      - name: Run display-free behavioral suite
        run: scripts/test-display-free.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # RUSTSEC advisories, yanked crates, and license/source policy
      # from deny.toml. Advisory-only failures don't block unrelated
      # PRs: this job is required only on the main push.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
