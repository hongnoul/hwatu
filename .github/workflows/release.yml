name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: hwatu-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: hwatu-linux-aarch64

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          staging="${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/hwatu" "$staging/"
          cp "target/${{ matrix.target }}/release/hwatud" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}.tar.gz.sha256" \
            --clobber

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Publish only if at least one asset made it up.
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets | length')
          if [ "$count" -eq 0 ]; then
            echo "no assets uploaded; leaving release as draft" >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
