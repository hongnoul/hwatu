name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: hwatu-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: hwatu-linux-aarch64

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          staging="${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/hwatu" "$staging/"
          cp "target/${{ matrix.target }}/release/hwatud" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}.tar.gz.sha256" \
            --clobber

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Publish only if at least one asset made it up.
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets | length')
          if [ "$count" -eq 0 ]; then
            echo "no assets uploaded; leaving release as draft" >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    outputs:
      ran: ${{ steps.outcome.outputs.ran }}
    # NOTE: the secrets context is not allowed in `if:` conditions at
    # either job or step level on this runner, so every secret-dependent
    # step checks "$AUR_SSH_KEY" inside its run script and exits 0
    # (skip) when unset. The sentinel outcome step records whether the
    # push actually ran; aur-reminder opens the manual issue otherwise.
    steps:
      - uses: actions/checkout@v5

      - name: Install makepkg (pacman)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "AUR_SSH_KEY not set; skipping makepkg install."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq pacman-package-manager

      - name: Set up AUR SSH key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "AUR_SSH_KEY not set; skipping key setup."
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      # The script itself is idempotent: it no-ops when live is current
      # and aborts on .SRCINFO drift before pushing.
      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "AUR_SSH_KEY not set; skipping publish (aur-reminder will open the manual issue)."
            exit 0
          fi
          scripts/aur-publish.sh

      - name: Record publish outcome
        id: outcome
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "${AUR_SSH_KEY:-}" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_KEY secret not set; automated publish skipped."
          fi

  aur-reminder:
    name: AUR publish reminder
    runs-on: ubuntu-latest
    needs: [publish, aur-publish]
    # Run the reminder only when the automated publish did not run
    # (no secret). It either pushed or no-oped because live was current.
    if: ${{ always() && needs.aur-publish.outputs.ran != 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The AUR push needs a maintainer SSH key that cannot live in CI,
      # so it is the one manual step left after a release. Issue #72
      # happened because that step was forgotten and nothing noticed.
      # Open a tracking issue so it is visible instead of implicit.
      - name: Open AUR publish tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          live=$(curl -s "https://aur.archlinux.org/rpc/v5/info?arg[]=hwatu" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["results"]; print(r[0]["Version"] if r else "none")')
          echo "release: $tag / AUR live: $live"
          if [ "${live%%-*}" = "${tag#v}" ]; then
            echo "AUR already at $tag; nothing to do."
            exit 0
          fi
          gh issue create \
            --title "Publish $tag to the AUR" \
            --label packaging \
            --body "$(printf '%s\n' \
              "\`$tag\` is released but the AUR package is at \`$live\`." \
              "" \
              "Run from a machine with the AUR SSH key:" \
              "" \
              '```' \
              "scripts/aur-publish.sh" \
              '```' \
              "" \
              "Then verify:" \
              "" \
              '```' \
              "curl -s 'https://aur.archlinux.org/rpc/v5/info?arg[]=hwatu' | jq '.results[0].Version'" \
              '```' \
              "" \
              "Opened automatically by the release workflow (see #72 for why).")" \
            || echo "could not open issue (label may not exist); not failing the release"
