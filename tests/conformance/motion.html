<!DOCTYPE html><meta charset="utf-8"><title>motion</title>
<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#s { width: 40px; height: 40px; background: #06c; animation: spin 2s linear infinite; }
#h { width: 40px; height: 40px; background: #c60; transition: opacity 300ms ease-in-out; }
</style>
<div id="s"></div><div id="h"></div>
