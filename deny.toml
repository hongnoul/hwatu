# cargo-deny policy: enforced by the "Dependency audit" CI job.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything in the tree today is permissive. MPL-2.0 covers webkit6
# bindings' data files if they ever appear; add copyleft licenses
# deliberately, not by CI failure fatigue.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# The workspace itself is AGPL-3.0-only; keep the copyleft allowance
# scoped to our own crates so third-party copyleft still trips CI.
exceptions = [
  { name = "hwatu", allow = ["AGPL-3.0-only"] },
  { name = "hwatud", allow = ["AGPL-3.0-only"] },
  { name = "hwatu-ipc", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps carry no version; they are not the
# supply-chain risk this lint is for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
