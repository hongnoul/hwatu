[package]
name = "hwatu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless verification browser for AI coding agents: real WebKit rendering, ~13ms window spawn, MCP server"
keywords = ["browser", "webkit", "agent", "mcp", "verification"]
categories = ["web-programming", "development-tools", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
hwatu-ipc = { path = "../ipc", version = "0.7.2" }
hwatu-pixeldiff = { path = "../pixeldiff", version = "0.7.2" }
hwatu-snapshot = { path = "../snapshot", version = "0.7.2" }
hwatu-motionfit = { path = "../motionfit", version = "0.7.2" }
serde_json = "1"
# `hwatu clone` crops engine screenshots for blank WebGL canvases.
png = "0.17"

[target.'cfg(unix)'.dependencies]
# open(2) flag values are per-kernel-ABI AND per-arch; libc is arch-correct by construction.
libc = { version = "0.2", default-features = false }
