[package]
name = "hwatud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon for hwatu: warm WebKitGTK engine with prewarmed WebViews for ~13ms window spawn"
keywords = ["browser", "webkit", "agent", "mcp", "automation"]
categories = ["web-programming", "development-tools"]

[dependencies]
hwatu-ipc = { path = "../ipc", version = "0.7.1" }
# v4_14 for TextureDownloader (diff pixel access) and Monitor::scale
# (fractional-scale-aware CSS-px viewports); GTK 4.14 = GNOME 46.
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
# Per-window Wayland app_id (xdg_toplevel), for tiling-WM window rules.
gdk-wayland = { package = "gdk4-wayland", version = "0.9" }
# v2_42 for the WebKitFeature API (enable-what-exists scroll features);
# sets the runtime floor at webkitgtk 2.42 (GNOME 45, Sep 2023).
webkit6 = { version = "0.4", features = ["v2_42"] }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
subtle = "2.6"
