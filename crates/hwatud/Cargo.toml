[package]
name = "hwatud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hwatu-ipc = { path = "../ipc" }
gtk = { package = "gtk4", version = "0.9" }
# v2_42 for the WebKitFeature API (enable-what-exists scroll features);
# sets the runtime floor at webkitgtk 2.42 (GNOME 45, Sep 2023).
webkit6 = { version = "0.4", features = ["v2_42"] }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
