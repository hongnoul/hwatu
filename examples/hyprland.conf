# hwatu + Hyprland
# Drop these lines into ~/.config/hypr/hyprland.conf

# Launch a browser window like you launch a terminal
bind = SUPER, B, exec, hwatu
bind = SUPER SHIFT, B, exec, hwatu duckduckgo.com

# Float utility pages, tile everything else (hwatu windows have app_id "dev.hwatu.hwatud")
windowrulev2 = tile, class:^(dev.hwatu.hwatud)$
# Example: keep a picture-in-picture style float for a specific page title
# windowrulev2 = float, class:^(dev.hwatu.hwatud)$, title:^(.*YouTube.*)$

# Optional: dedicated workspace for browsing
# windowrulev2 = workspace 2, class:^(dev.hwatu.hwatud)$

# Agent/background windows (hwatu --background, and the default when a
# coding agent drives hwatu) must not steal focus.
windowrule = noinitialfocus, class:^(hwatu-background)$
